[project]
name = "muronto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "labapi",
    "streamlit>=1.55.0",
]
[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=8.0.0",
    "ruff>=0.15.7",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = ["I", "E501"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
files = ["Project.py", "pages", "muronto_app", "tests"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["labapi"]
ignore_missing_imports = true
